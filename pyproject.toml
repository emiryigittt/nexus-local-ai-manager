[project]
name = "nexus-local-ai"
version = "0.3.0b2"
description = "A private, Spotlight-style AI command center for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["local-ai", "lm-studio", "desktop", "vision", "pyqt6"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

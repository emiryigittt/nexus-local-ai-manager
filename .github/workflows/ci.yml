name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-source:
    name: Retire superseded main builds
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m scripts.cancel_superseded_runs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    needs: current-source
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python scripts/check_public_repo.py
      - run: python -m pytest

  source-beta:
    name: Publish verified source beta
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: nexus-source-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publish pinned source prerelease after all Windows checks pass
        run: python scripts/publish_source_beta.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  windows-package:
    name: Build and verify GPL Windows installer
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'emiryigittt/nexus-local-ai-manager'
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      ready: ${{ steps.release-check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: packaging/windows-build.lock.txt
      - name: Check whether this beta still needs publication
        id: release-check
        run: python -m scripts.publish_windows_release --check-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.release-check.outputs.build == 'true'
        run: python -m pip install -r packaging/windows-build.lock.txt
      - name: Mirror and verify corresponding sources
        if: steps.release-check.outputs.build == 'true'
        run: python -m scripts.prepare_distribution
      - name: Build application and installer
        if: steps.release-check.outputs.build == 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup 6 is unavailable' }
          python -m scripts.build_windows --compiler $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test clean installation, repeated installation and uninstall
        if: steps.release-check.outputs.build == 'true'
        run: python -m scripts.check_windows_package --installer dist/installer/NexusSetup.exe
      - name: Assemble verified release assets
        if: steps.release-check.outputs.build == 'true'
        run: python -m scripts.finalize_windows_release
      - uses: actions/upload-artifact@v4
        if: steps.release-check.outputs.build == 'true'
        with:
          name: nexus-verified-windows-beta
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-release:
    name: Publish complete Windows beta
    needs: windows-package
    if: needs.windows-package.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: nexus-windows-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: nexus-verified-windows-beta
          path: dist/release
      - name: Publish source archives and installer together
        run: python -m scripts.publish_windows_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
